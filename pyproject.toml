[project]
name = "orgflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pypdf>=4.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["api"]